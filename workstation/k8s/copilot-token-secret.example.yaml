# Exemplo de Secret com o token do GitHub Copilot CLI.
# NAO grave o token real neste arquivo nem no git. Copie, preencha localmente e aplique:
#   oc apply -n <SEU-NAMESPACE-DEVSPACES> -f copilot-token-secret.example.yaml
# O Secret deve existir no namespace do usuario ANTES de iniciar o workspace.
# O token e um PAT fine-grained com a permissao "Copilot Requests".
apiVersion: v1
kind: Secret
metadata:
  name: copilot-token
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-secret: "true"
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  GH_TOKEN: "<COLE-O-TOKEN-AQUI>"
